<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  body { width: 340px; margin: 0; padding: 12px; font: 13px system-ui, sans-serif; background: #16181c; color: #e6e6e6; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  .row { display: flex; gap: 6px; align-items: center; margin: 6px 0; }
  input[type=number] { width: 56px; background: #22252b; color: inherit; border: 1px solid #3a3e46; border-radius: 4px; padding: 3px; }
  button { flex: 1; padding: 6px; border: 0; border-radius: 5px; background: #2f6fed; color: #fff; cursor: pointer; }
  button.sec { background: #33373f; }
  button.danger { background: #6b2a2a; }
  button:disabled { opacity: .5; cursor: default; }
  #status { color: #9aa0a6; min-height: 16px; margin: 6px 0; }
  #count b { color: #fff; }
  ol { max-height: 220px; overflow: auto; margin: 6px 0 0; padding-left: 20px; }
  li { margin: 3px 0; }
  li small { color: #8a9099; }
  li.judged { opacity: .45; }
  .warn { color: #e0a44a; }
</style>
</head>
<body>
  <h1>SaveTicker 뉴스 수집기</h1>
  <div id="count">수집: <b id="n">0</b>건</div>
  <div id="status"></div>

  <div class="row">
    <input id="pages" type="number" min="1" max="50" value="5"> 페이지
    <button id="collect">수집 시작</button>
    <button id="stop" class="sec">중지</button>
  </div>
  <div class="row">
    <label><input id="watch" type="checkbox"> 실시간 감시</label>
    <input id="sec" type="number" min="30" value="60"> 초마다
  </div>
  <div class="row">
    <label><input id="auto" type="checkbox" checked> 자동 저장 (날짜별 CSV → C:\_c\saveticker\data)</label>
  </div>
  <div class="row">
    <button id="csv" class="sec">CSV 저장</button>
    <button id="json" class="sec">JSON 저장</button>
    <button id="clear" class="danger">초기화</button>
  </div>
  <div id="saveStatus" style="color:#9aa0a6"></div>
  <ol id="list"></ol>
<script src="popup.js"></script>
</body>
</html>
